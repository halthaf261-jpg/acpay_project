<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACPay Secure Gateway | Two Scanners</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
    
    <!-- Top Header -->
    <div class="bg-[#6440fe] text-white p-5 flex justify-between items-center">
      <div>
        <h1 class="font-extrabold text-base tracking-wide">ACPay Deposit Gateway</h1>
        <p class="text-[11px] text-indigo-200">User: <span id="display-user-email">...</span></p>
      </div>
      <div class="text-right">
        <span class="text-[10px] uppercase font-bold text-indigo-200 block">Deposit Amount</span>
        <span id="display-amount" class="text-2xl font-black font-mono">₹0.00</span>
      </div>
    </div>

    <div class="p-6 space-y-6">

      <!-- Scanner Switcher (Scanner 1 vs Scanner 2) -->
      <div>
        <span class="text-xs font-bold text-slate-700 uppercase tracking-wider block mb-2">Select Payment Scanner</span>
        <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-2xl border border-slate-200 text-xs font-bold">
          <button id="btn-tab-s1" onclick="switchScanner('scanner1')" class="py-2.5 rounded-xl bg-[#6440fe] text-white shadow-sm transition">
            Scanner 1 (PhonePe)
          </button>
          <button id="btn-tab-s2" onclick="switchScanner('scanner2')" class="py-2.5 rounded-xl text-slate-600 hover:text-slate-900 transition">
            Scanner 2 (Paytm)
          </button>
        </div>
      </div>
      
      <!-- QR Scanner Display Container -->
      <div class="flex flex-col items-center bg-slate-50 border border-slate-200 rounded-3xl p-5 shadow-inner">
        <span id="active-scanner-title" class="text-xs font-bold text-slate-800 uppercase tracking-wider mb-2 text-center">Primary Fast Scanner</span>
        <div class="w-56 h-56 bg-white p-2.5 rounded-2xl border border-slate-200 shadow-md flex items-center justify-center overflow-hidden">
          <img id="active-qr-img" src="" alt="Payment Scanner" class="w-full h-full object-contain rounded-xl">
        </div>
        <div class="flex items-center gap-2 mt-3 text-xs text-slate-500">
          <i class="fa-solid fa-qrcode text-[#6440fe]"></i>
          <span id="active-scanner-vpa" class="font-mono font-bold text-indigo-900">...</span>
        </div>
      </div>

      <!-- Company Bank Account Transfer Details -->
      <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-2 text-xs font-mono">
        <div class="text-[11px] font-sans font-bold uppercase tracking-wider text-slate-700 mb-1">Company Direct Deposit Bank</div>
        <div class="flex justify-between items-center py-1 border-b border-slate-200">
          <span class="text-slate-500 font-sans">Bank:</span>
          <span id="disp-bank-name" class="font-bold text-slate-800 font-sans">State Bank of India</span>
        </div>
        <div class="flex justify-between items-center py-1 border-b border-slate-200">
          <span class="text-slate-500 font-sans">Account Holder:</span>
          <span id="disp-acc-holder" class="font-bold text-slate-800 font-sans">Althaf Hussain</span>
        </div>
        <div class="flex justify-between items-center py-1 border-b border-slate-200">
          <span class="text-slate-500 font-sans">Account No:</span>
          <span id="disp-acc-num" class="font-bold text-indigo-700 text-sm">42971394203</span>
        </div>
        <div class="flex justify-between items-center py-1">
          <span class="text-slate-500 font-sans">IFSC Code:</span>
          <span id="disp-ifsc" class="font-bold text-slate-800 uppercase">SBIN0000977</span>
        </div>
      </div>

      <!-- Enter 12-Digit UTR Number -->
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Enter 12-Digit UTR Reference Number</label>
          <input id="utr-input" type="text" maxlength="16" placeholder="e.g. 423981729103" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm font-mono font-bold text-slate-800 outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 shadow-sm">
        </div>

        <button onclick="submitUtrSlip()" id="btn-submit-utr" class="w-full bg-[#6440fe] hover:bg-[#522fe6] text-white font-bold py-3.5 rounded-xl shadow-md text-sm transition flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-circle-check"></i>
          <span>Submit UTR for Verification</span>
        </button>
      </div>

      <div id="status-box" class="hidden p-4 rounded-xl text-center text-xs space-y-1"></div>

    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const amount = urlParams.get('amount') || '500';
    const email = urlParams.get('email') || 'user@gmail.com';

    document.getElementById('display-amount').innerText = `₹${Number(amount).toLocaleString('en-IN')}`;
    document.getElementById('display-user-email').innerText = email;

    let scannersConfig = null;
    let activeScannerKey = 'scanner1';

    async function loadScanners() {
      try {
        const res = await fetch('/api/scanners/config');
        const data = await res.json();
        if (data.success && data.config) {
          scannersConfig = data.config;

          const b = scannersConfig.companyBank || {};
          document.getElementById('disp-bank-name').innerText = b.bankName || 'State Bank of India';
          document.getElementById('disp-acc-holder').innerText = b.accountHolder || 'Althaf Hussain';
          document.getElementById('disp-acc-num').innerText = b.accountNumber || '42971394203';
          document.getElementById('disp-ifsc').innerText = b.ifsc || 'SBIN0000977';

          renderActiveScanner();
        }
      } catch (err) {
        console.error(err);
      }
    }

    function switchScanner(key) {
      activeScannerKey = key;
      const isS1 = key === 'scanner1';
      document.getElementById('btn-tab-s1').className = isS1
        ? 'py-2.5 rounded-xl bg-[#6440fe] text-white shadow-sm transition'
        : 'py-2.5 rounded-xl text-slate-600 hover:text-slate-900 transition';

      document.getElementById('btn-tab-s2').className = !isS1
        ? 'py-2.5 rounded-xl bg-[#6440fe] text-white shadow-sm transition'
        : 'py-2.5 rounded-xl text-slate-600 hover:text-slate-900 transition';

      renderActiveScanner();
    }

    function renderActiveScanner() {
      if (!scannersConfig) return;
      const s = scannersConfig[activeScannerKey];
      document.getElementById('active-scanner-title').innerText = s.title;
      document.getElementById('active-scanner-vpa').innerText = s.upiVpa;

      const img = document.getElementById('active-qr-img');
      if (s.image && s.image.trim() !== '') {
        img.src = s.image;
      } else {
        const upiUrl = `upi://pay?pa=${s.upiVpa}&pn=${encodeURIComponent(s.accountName)}&am=${amount}&cu=INR`;
        img.src = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(upiUrl)}`;
      }
    }

    async function submitUtrSlip() {
      const utr = document.getElementById('utr-input').value.trim();
      if (!utr || utr.length < 8) return alert('Enter a valid 12-digit UTR reference number');

      const btn = document.getElementById('btn-submit-utr');
      btn.innerText = 'Submitting...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/user/submit-utr', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email,
            amount,
            utr,
            selectedScanner: activeScannerKey === 'scanner1' ? 'Scanner 1' : 'Scanner 2'
          })
        });
        const data = await res.json();
        const box = document.getElementById('status-box');
        box.classList.remove('hidden');

        if (data.success) {
          box.className = 'p-4 rounded-xl text-center text-xs bg-emerald-50 text-emerald-800 border border-emerald-200';
          box.innerHTML = `
            <i class="fa-solid fa-check-circle text-emerald-600 text-lg mb-1 block"></i>
            <p class="font-bold">UTR ${utr} Transmitted to Admin!</p>
            <p class="text-slate-500">Points will be added to your balance upon admin verification.</p>
          `;
          document.getElementById('utr-input').disabled = true;
          btn.classList.add('hidden');
        } else {
          box.className = 'p-4 rounded-xl text-center text-xs bg-rose-50 text-rose-800 border border-rose-200';
          box.innerText = data.error || 'Submission failed';
          btn.innerText = 'Submit UTR for Verification';
          btn.disabled = false;
        }
      } catch (err) {
        alert('Server unreachable');
        btn.innerText = 'Submit UTR for Verification';
        btn.disabled = false;
      }
    }

    loadScanners();
  </script>
</body>
</html>
